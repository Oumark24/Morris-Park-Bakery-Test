<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Abstract mint and crimson package material composition</title>
  <desc id="desc">Non-documentary geometric package materials with folded paper planes, ribbons, and soft studio light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21100f"/>
      <stop offset=".44" stop-color="#4f201a"/>
      <stop offset="1" stop-color="#2a0d0d"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7e9"/>
      <stop offset=".28" stop-color="#a8d6c2"/>
      <stop offset=".71" stop-color="#5d9886"/>
      <stop offset="1" stop-color="#31584f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".5" stop-color="#ead9bb"/>
      <stop offset="1" stop-color="#b99574"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b201b"/>
      <stop offset=".48" stop-color="#d85b48"/>
      <stop offset="1" stop-color="#8e2a22"/>
    </linearGradient>
    <radialGradient id="seal" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".27" stop-color="#e9c98d"/>
      <stop offset=".62" stop-color="#a8d6c2"/>
      <stop offset="1" stop-color="#4e7569"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="38" stdDeviation="34" flood-color="#160504" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".72" numOctaves="2" seed="17" type="fractalNoise"/>
      <feColorMatrix values="1 0 0 0 0.8 0 1 0 0 0.75 0 0 1 0 0.66 0 0 0 .12 0"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <ellipse cx="1500" cy="493" rx="486" ry="439" fill="#f7e7c4" opacity=".12" filter="url(#soft)"/>
  <ellipse cx="1514" cy="1040" rx="570" ry="290" fill="#a8d6c2" opacity=".12" filter="url(#soft)"/>
  <g transform="translate(1040 84) rotate(-11 350 480)" filter="url(#shadow)">
    <path d="M155 143 604 42 746 333 278 457Z" fill="url(#cream)"/>
    <path d="M604 42 850 225 746 333 604 42Z" fill="#cda97f"/>
    <path d="M155 143 278 457 105 748 -54 435Z" fill="#8dc2ad" opacity=".72"/>
    <path d="M278 457 746 333 818 725 333 850Z" fill="url(#mint)"/>
    <path d="M333 850 818 725 642 1029 156 1045Z" fill="#436d63" opacity=".9"/>
    <path d="M155 143 604 42 850 225 746 333 278 457Z" fill="none" stroke="#fffdf7" stroke-opacity=".46" stroke-width="4"/>
    <path d="M278 457 746 333 818 725 333 850Z" fill="none" stroke="#fffdf7" stroke-opacity=".28" stroke-width="4"/>
    <path d="M-8 270 784 155 820 262 22 374Z" fill="url(#ribbon)"/>
    <path d="M377 69 524 962 635 944 488 49Z" fill="url(#ribbon)"/>
    <path d="M11 276 798 161" stroke="#fff7e9" stroke-opacity=".42" stroke-width="5"/>
    <circle cx="470" cy="468" r="122" fill="url(#seal)" stroke="#fffdf7" stroke-opacity=".68" stroke-width="5"/>
    <circle cx="470" cy="468" r="83" fill="none" stroke="#5a241c" stroke-opacity=".45" stroke-width="15"/>
    <path d="M412 468h116M470 410v116" stroke="#fffdf7" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M1220 124c201 10 406 146 535 344" fill="none" stroke="#fffdf7" stroke-opacity=".22" stroke-width="3"/>
  <path d="M1147 1038c230-87 448-79 658 39" fill="none" stroke="#a8d6c2" stroke-opacity=".24" stroke-width="3"/>
  <g fill="#a8d6c2">
    <circle cx="1164" cy="260" r="9"/><circle cx="1717" cy="806" r="6"/><circle cx="1560" cy="153" r="5"/>
  </g>
  <rect width="1920" height="1200" opacity=".24" filter="url(#grain)"/>
</svg>
